services:
  backend:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./:/app
      # Trusted orchestrator only. Target workers never receive this socket.
      - /var/run/docker.sock:/var/run/docker.sock
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
