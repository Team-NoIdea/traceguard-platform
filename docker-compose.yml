# TraceGuard backend — single service, no Redis/Postgres/Celery yet.
# `docker compose up` gives the whole team the same Python 3.12
# environment regardless of what's on their host machine.

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Bind-mount the repo so uvicorn --reload picks up local edits
      # without rebuilding the image.
      - ./:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
